<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — CLEOMUN 2027</title>
<link rel="icon" href="logo-icon.png">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<canvas id="particles"></canvas>

<div id="transition-overlay">
  <svg id="scarab-fly" viewBox="0 0 64 64" fill="none"><path d="M32 20c-6 0-10 4-10 10 0 3 1 6 4 8-5 1-8 5-8 10 0 6 6 10 14 10s14-4 14-10c0-5-3-9-8-10 3-2 4-5 4-8 0-6-4-10-10-10z" fill="currentColor"/><path d="M14 24l-8-6 2 8 6-1-2 7 8-2-1 7 7-4v-6l-6-2 2-7-7 2 1-7-7 3z" fill="currentColor"/><path d="M50 24l8-6-2 8-6-1 2 7-8-2 1 7-7-4v-6l6-2-2-7 7 2-1-7 7 3z" fill="currentColor"/></svg>
</div>

<div id="toast"></div>

<div class="page page-enter">
  <header class="site-header">
    <a href="index.html" class="brand" data-nav>
      <img src="logo-icon.png" alt="CLEOMUN emblem" class="brand-logo">
      <span>
        <span class="brand-word">CLEO<b>MUN</b></span><br>
        <span class="brand-sub">New Delhi &middot; 3–4 Apr 2027</span>
      </span>
    </a>
    <a href="index.html" class="btn btn-ghost btn-sm" data-nav>Back to Home</a>
  </header>

  <main>
    <div class="wrap" style="max-width:920px;">
      <div class="eyebrow">Registration</div>
      <h1 class="page-title">How Are You Registering?</h1>
      <p class="page-sub">Choose the option that matches your delegation. Each has a slightly different process.</p>

      <div class="type-grid">
        <button type="button" class="type-card" id="type-individual">
          <span class="tc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
          </span>
          <span class="tc-name">Individual</span>
          <span class="tc-desc">Registering on your own, as a single delegate. Choose your committee and portfolio yourself.</span>
          <span class="tc-cta">Continue as individual
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </button>

        <button type="button" class="type-card" id="type-group">
          <span class="tc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.6"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5S15.5 16.4 15.5 20"/><path d="M15 14.2c2.9.2 5.5 2.6 5.5 5.8"/></svg>
          </span>
          <span class="tc-name">Group Delegation</span>
          <span class="tc-desc">Registering a group of friends or a college club together. One leader submits the full roster.</span>
          <span class="tc-cta">Continue as group
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </button>

        <button type="button" class="type-card" id="type-school">
          <span class="tc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10l9-5 9 5-9 5-9-5z"/><path d="M7 12.5V17c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4.5"/><path d="M21 10v5"/></svg>
          </span>
          <span class="tc-name">School Delegation</span>
          <span class="tc-desc">Registering students through your school. The teacher in-charge submits details and a collective payment.</span>
          <span class="tc-cta">Continue as school
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </button>
      </div>
    </div>
  </main>

  <footer class="site-footer">CLEOMUN &middot; New Delhi &middot; Global Voices, Timeless Legacy.</footer>
</div>

<script src="script.js"></script>
</body>
</html>
